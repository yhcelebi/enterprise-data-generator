name: Generate dataset

# Run from the Actions tab. One job per company runs in parallel; each job uploads its
# own Parquet files to the Hugging Face dataset repository given below.
on:
  workflow_dispatch:
    inputs:
      scale:
        description: Company size for finance tables (0.3 = full demo set)
        default: "0.3"
      detail:
        description: Industry detail volume (1.0 = full demo set, 0 = finance only)
        default: "1.0"
      first_year:
        description: First year of data
        default: "1995"
      hf_repo:
        description: Hugging Face dataset repository (owner/name)
        required: true
      private:
        description: Keep the dataset private
        type: boolean
        default: true

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt huggingface_hub
      - run: python -m edg --companies none --shared --first-year ${{ inputs.first_year }} --out out
      - run: python scripts/upload_hf.py out ${{ inputs.hf_repo }} ${{ inputs.private && '--private' || '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  company:
    needs: shared
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        company: [ostim, kestrel, anatolia, pennine, bosphorus, alpenhof, cinar, brightmart, sifa, helix,
                  ufuk, meridian, poyraz, solenne, bilge, cobalt, temel, granite, marmara, rheinwerk,
                  kalkan, ironclad, telekent, aurore, kanat, albion, hayat, northbridge]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: pip install -r requirements.txt huggingface_hub
      - name: Generate
        run: python -m edg --companies ${{ matrix.company }} --scale ${{ inputs.scale }} --detail ${{ inputs.detail }} --first-year ${{ inputs.first_year }} --out out
      - name: Validate
        run: python scripts/validate.py out ${{ matrix.company }}
      - name: Upload
        run: python scripts/upload_hf.py out ${{ inputs.hf_repo }} ${{ inputs.private && '--private' || '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
